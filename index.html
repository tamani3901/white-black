<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>光マーカー通信 (修正版)</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 20px auto; padding: 15px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; height: 50px; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
    button { padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; margin-right: 5px; }
    button:disabled { background: #ccc; }
    .btn-send { background: #28a745; }
    .btn-listen { background: #007bff; }
    .btn-cancel { background: #dc3545; }
    select { padding: 8px; font-size: 14px; margin-bottom: 10px; }
    .result { font-size: 22px; font-weight: bold; color: #007bff; padding: 10px; background: #e8f4ff; border-radius: 6px; text-align: center; margin-top: 10px; }
    .log { font-family: monospace; font-size: 11px; background: #eee; padding: 8px; height: 120px; overflow-y: auto; margin-top: 10px; white-space: pre-wrap; }
    
    /* マーカー表示エリア */
    #txOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9999;
    }
    #marker { width: 250px; height: 250px; border: 4px solid red; background: black; }
    .video-container { position: relative; width: 100%; max-width: 320px; margin: 0 auto; }
    video { width: 100%; background: #000; }
    .target-box { position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; border: 2px dashed red; pointer-events: none; }
  </style>
</head>
<body>

  <h2>💡 光マーカー通信 (修正版)</h2>

  <div id="txOverlay">
    <div style="text-align:center;">
      <div id="marker"></div>
      <p style="color:white; margin-top:10px;">タップで送信中止</p>
    </div>
  </div>

  <div class="card">
    <h3>1. 送信設定</h3>
    <label>転送速度: </label>
    <select id="txSpeed">
      <option value="150">🛡️ 安定モード (150ms/bit)</option>
      <option value="100" selected>🚀 通常モード (100ms/bit)</option>
      <option value="60">⚡ 高速モード (60ms/bit)</option>
    </select>
    <textarea id="inputText" placeholder="送信文字">テスト</textarea>
    <button class="btn-send" id="btnSend">💡 送信開始</button>
  </div>

  <div class="card">
    <h3>2. 受信設定</h3>
    <label>受信速度設定: </label>
    <select id="rxSpeed">
      <option value="150">🛡️ 安定モード (150ms/bit)</option>
      <option value="100" selected>🚀 通常モード (100ms/bit)</option>
      <option value="60">⚡ 高速モード (60ms/bit)</option>
    </select>
    <div>
      <button class="btn-listen" id="btnListen">📷 受信開始</button>
      <button class="btn-cancel" id="btnCancel" disabled>⏹️ 停止</button>
    </div>
    <div class="video-container" style="margin-top:10px;">
      <video id="webcam" autoplay playsinline muted></video>
      <div class="target-box"></div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="status" style="margin-top:5px; font-weight:bold;">待機中</div>
    <div id="outputText" class="result">---</div>
    <div id="log" class="log">ログがここに表示されます</div>
  </div>

<script>
function encodeHamming(d4) {
  const d = [(d4>>3)&1, (d4>>2)&1, (d4>>1)&1, d4&1];
  return (d[0]<<6)|(d[1]<<5)|(d[2]<<4)|(d[3]<<3)|((d[0]^d[1]^d[3])<<2)|((d[0]^d[2]^d[3])<<1)|(d[1]^d[2]^d[3]);
}
function decodeHamming(c7) {
  const b = [];
  for (let i = 6; i >= 0; i--) b.push((c7 >> i) & 1);
  const s1 = b[0] ^ b[1] ^ b[3] ^ b[4];
  const s2 = b[0] ^ b[2] ^ b[3] ^ b[5];
  const s3 = b[1] ^ b[2] ^ b[3] ^ b[6];
  const err = (s1 << 2) | (s2 << 1) | s3;
  if (err >= 1 && err <= 7) b[err - 1] ^= 1;
  return (b[0]<<3) | (b[1]<<2) | (b[2]<<1) | b[3];
}
function byteTo14Bits(val) {
  const h = encodeHamming((val >> 4) & 0x0F);
  const l = encodeHamming(val & 0x0F);
  let bits = [];
  for (let i = 6; i >= 0; i--) bits.push((h >> i) & 1);
  for (let i = 6; i >= 0; i--) bits.push((l >> i) & 1);
  return bits;
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += "\n" + msg;
  el.scrollTop = el.scrollHeight;
}

// --- 送信処理 ---
let txInterval = null;
document.getElementById('btnSend').onclick = () => {
  const text = document.getElementById('inputText').value;
  const speed = parseInt(document.getElementById('txSpeed').value);
  if (!text) return;

  const bytes = new TextEncoder().encode(text);
  let bits = [];
  
  // スタートパルス (白長め: 400ms分)
  const syncCount = Math.ceil(400 / speed);
  for(let i=0; i<syncCount; i++) bits.push(1);

  // ヘッダー(長さ) + データ
  const headerBits = byteTo14Bits(bytes.length & 0x7F);
  headerBits.forEach(b => bits.push(b));
  bytes.forEach(b => byteTo14Bits(b).forEach(bit => bits.push(bit)));

  const overlay = document.getElementById('txOverlay');
  const marker = document.getElementById('marker');
  overlay.style.display = 'flex';

  let idx = 0;
  txInterval = setInterval(() => {
    if (idx >= bits.length) {
      stopTx();
      log('送信が正常終了しました');
      return;
    }
    marker.style.background = bits[idx] === 1 ? 'white' : 'black';
    idx++;
  }, speed);
};

function stopTx() {
  if (txInterval) { clearInterval(txInterval); txInterval = null; }
  document.getElementById('txOverlay').style.display = 'none';
}
document.getElementById('txOverlay').onclick = stopTx;

// --- 受信処理 ---
let rxInterval = null;
let stream = null;

function stopRx() {
  if (rxInterval) { clearInterval(rxInterval); rxInterval = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('btnListen').disabled = false;
  document.getElementById('btnCancel').disabled = true;
  document.getElementById('status').textContent = '⏹️ 停止しました';
}

document.getElementById('btnCancel').onclick = stopRx;

document.getElementById('btnListen').onclick = async () => {
  const speed = parseInt(document.getElementById('rxSpeed').value);
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
  } catch(e) {
    log('カメラエラー: ' + e.message);
    return;
  }

  document.getElementById('btnListen').disabled = true;
  document.getElementById('btnCancel').disabled = false;

  let bitStream = [];
  let state = 'idle';
  let minL = 255, maxL = 0;

  // チェック間隔は設定スピードの1/2
  rxInterval = setInterval(() => {
    if (video.videoWidth === 0) return;
    canvas.width = 160; canvas.height = 120;
    ctx.drawImage(video, 0, 0, 160, 120);

    // 中央の点線枠エリアのみ輝度計算
    const imgData = ctx.getImageData(40, 30, 80, 60).data;
    let totalL = 0;
    for (let i = 0; i < imgData.length; i += 4) {
      totalL += (0.299*imgData[i] + 0.587*imgData[i+1] + 0.114*imgData[i+2]);
    }
    const avgL = totalL / (imgData.length / 4);

    if (avgL < minL) minL = avgL;
    if (avgL > maxL) maxL = avgL;
    const th = (minL + maxL) / 2;
    const bit = avgL > th ? 1 : 0;

    if (state === 'idle') {
      if (avgL > th && (maxL - minL > 20)) {
        state = 'rx';
        bitStream = [];
        log('光同期信号を検出');
      }
    } else if (state === 'rx') {
      bitStream.push(bit);
      document.getElementById('status').textContent = `受信中: ${bitStream.length} ビット`;

      // 14bit単位で復号
      if (bitStream.length >= 14) {
        const len = decodeByte(bitStream.slice(0, 14));
        const total = (1 + len) * 14;
        if (len > 0 && bitStream.length >= total) {
          let bytes = [];
          for(let i=1; i<=len; i++) {
            bytes.push(decodeByte(bitStream.slice(i*14, (i+1)*14)));
          }
          const text = new TextDecoder().decode(new Uint8Array(bytes));
          document.getElementById('outputText').textContent = text;
          log('✅ 復元完了: ' + text);
          stopRx();
        }
      }
    }
  }, speed / 2);
};

function decodeByte(bits14) {
  if (bits14.length < 14) return 0;
  const h = bits14.slice(0, 7).reduce((acc, b) => (acc << 1) | b, 0);
  const l = bits14.slice(7, 14).reduce((acc, b) => (acc << 1) | b, 0);
  return (decodeHamming(h) << 4) | decodeHamming(l);
}
</script>
</body>
</html>
